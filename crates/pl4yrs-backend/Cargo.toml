[package]
name = "pl4yrs-backend"
version.workspace = true
description = "Pl4yrs backend and API service"
authors = ["Sergio Visinoni <piffio@piffio.org>"]
license = "MIT"
edition = "2024"

[package.metadata.deb]
maintainer = "Sergio Visinoni <piffio@piffio.org>"
depends = "$auto, sendspin-cli"
section = "sound"
priority = "optional"
maintainer-scripts = "debian/"
systemd-units = { enable = true, start = true, restart-after-upgrade = true }
assets = [
    ["target/release/pl4yrs-backend", "usr/bin/", "755"],
]

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env", "help"] }
futures-core = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = { version = "0.1.44", features = ["valuable"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
valuable = { version = "0.1.1", features = ["derive"] }
pl4yrs-api = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
