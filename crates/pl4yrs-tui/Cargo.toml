[package]
name = "pl4yrs-tui"
version.workspace = true
description = "Pl4yrs TUI client"
authors = ["Sergio Visinoni <piffio@piffio.org>"]
license = "MIT"
edition = "2024"

[package.metadata.deb]
maintainer = "Sergio Visinoni <piffio@piffio.org>"
depends = "$auto"
section = "sound"
priority = "optional"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env", "help"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.32"
ratatui = "0.30.2"
tokio = { version = "1.52.3", features = ["full"] }
color-eyre = "0.6.5"
pl4yrs-api = { workspace = true }
anyhow = "1.0.104"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
eventsource-stream = "0.2.3"
serde_json = "1.0.154"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["full", "test-util"] }
