[package]
name = "pl4yrs-tui"
version = "0.1.0"
description = "Pl4yrs TUI client"
authors = ["Sergio Visinoni <piffio@piffio.org>"]
license = "MIT"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env", "help"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.32"
ratatui = "0.30.2"
tokio = { version = "1.52.3", features = ["full"] }
color-eyre = "0.6.5"
pl4yrs-api = { workspace = true }
anyhow = "1.0.104"
reqwest = { version = "0.13.5", features = ["json"] }
