name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build And Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # 2.0.1
        with:
          components: rustfmt clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Install build dependencies
        uses: knu/apt-bundle@e2785799997e987b92cfe5d73e325991d4eb2dcd # 1.4.2
      - name: Run Clippy linter
        run: cargo clippy -- -D warnings
      - name: Build
        run: cargo build --verbose
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov
      - name: Run tests and generate coverage
        run: cargo llvm-cov --workspace --exclude pl4yrsd --lcov --output-path lcov.info --ignore-filename-regex test_support.rs
      - name: Print coverage report
        run: cargo llvm-cov report -p pl4yrs-api -p pl4yrs-backend -p pl4yrs-tui --ignore-filename-regex test_support.rs
      - name: Upload to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: lcov.info

  deb-arm64:
    name: deb-arm64
    runs-on: ubuntu-26.04-arm
    container:
      image: rust:1-trixie
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked --version =3.8.0

      - name: Build the deb packages
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            scripts/build-deb.sh --debrev 1
          else
            scripts/build-deb.sh
          fi

      - name: Generate Checksums
        run: |
          cd dist
          shasum -a 256 *.deb > SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pl4yrs-arm64-debs
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    #if: github.ref_type == 'tag'
    name: release
    runs-on: ubuntu-26.04-arm
    needs: [build-and-test, deb-arm64]
    container:
      image: debian:trixie
    steps:
      - name: Install gh
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gh

      - name: Fetch the artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pl4yrs-arm64-debs
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # 3.0.3
        with:
          working_directory: dist
          token: ${{ secrets.GH_TOKEN }}
          files: |
            *.deb
            SHA256SUMS
