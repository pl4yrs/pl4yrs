name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build And Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # 2.0.1
        with:
          components: rustfmt clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Install build dependencies
        uses: knu/apt-bundle@e2785799997e987b92cfe5d73e325991d4eb2dcd # 1.4.2
      - name: Run Clippy linter
        run: cargo clippy -- -D warnings
      - name: Build
        run: cargo build --verbose
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov
      - name: Run tests and generate coverage
        run: cargo llvm-cov --workspace --exclude pl4yrsd --lcov --output-path lcov.info --ignore-filename-regex test_support.rs
      - name: Print coverage report
        run: cargo llvm-cov report -p pl4yrs-api -p pl4yrs-backend -p pl4yrs-tui --ignore-filename-regex test_support.rs
      - name: Upload to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: lcov.info
